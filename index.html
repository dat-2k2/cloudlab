<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudLab</title>
<meta name="description" content="Node editor AWS trong trình duyệt: kéo thả hoặc viết CloudFormation, mô phỏng traffic, quyền IAM và chi phí theo thời gian thực. Bài học là các template có lỗi cài sẵn.">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem("cloudlab:theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(_){}</script>
<link rel="stylesheet" href="../kit/layout.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell app" data-shell>
  <header class="shell-top">
    <button class="icon-btn" data-shell-toggle aria-controls="side" aria-label="Thu gọn / mở thanh thành phần">☰</button>
    <a class="top-brand" href="https://dat-2k2.github.io/" title="Về trang chủ"><span class="mark" aria-hidden="true">D</span><span class="hide-s">Nguyen Quoc Dat</span><span class="app">/ CloudLab</span></a>
    <p class="top-crumb" id="crumb"></p>
    <div class="top-actions">
      <span class="chip live ok hide-s">ap-southeast-2 · Sydney</span>
      <a class="hide-s" href="https://github.com/dat-2k2/cloudlab" target="_blank" rel="noopener">GitHub ↗</a>
      <button class="icon-btn" id="theme" aria-label="Đổi giao diện sáng / tối" title="Sáng / tối">☾</button>
    </div>
  </header>
  <nav class="shell-side" id="side" aria-label="Bài học và thành phần"></nav>
  <main class="main">
    <div class="stackbar" id="bar"></div>
    <section class="work" id="work">
      <div class="pane-canvas" id="canvas" aria-label="Canvas"></div>
      <div class="pane-code" id="code" hidden></div>
    </section>
    <section class="simbar" id="simbar" aria-label="Mô phỏng"></section>
    <section class="logp" id="log" aria-label="Event log" hidden></section>
  </main>
  <aside class="lesson" id="lesson" aria-label="Bài học" aria-live="polite"></aside>
  <footer class="shell-foot">
    <span>Part of <a href="https://dat-2k2.github.io/">dat-2k2.github.io</a> · <a href="https://dat-2k2.github.io/">← Back to home</a></span>
    <span class="hide-s">Mô phỏng trong trình duyệt, không gọi AWS thật · giá tham khảo</span>
  </footer>
</div>
<aside class="drawer" id="drawer" hidden></aside>
<div id="modal"></div>
<script src="../kit/layout.js"></script>
<script src="vendor/js-yaml.min.js"></script>
<script src="src/core.js"></script><script src="src/catalog.js"></script><script src="src/model.js"></script><script src="src/infra.js"></script><script src="src/org.js"></script><script src="src/iam.js"></script>
<script src="src/sim.js"></script><script src="src/lessons.js"></script><script src="src/lessons-org.js"></script><script src="src/editor.js"></script><script src="src/iac.js"></script><script src="src/lint.js"></script><script src="src/ui.js"></script>
</body>
</html>
